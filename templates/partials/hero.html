<!-- Hero-->
<section class="container pt-5 my-5 pb-lg-4">
  <div class="row align-items-center g-4">
    <div class="col-lg-6 order-lg-2 text-center">
      {% load static %}
      <img src="{% static 'img/real-estate/illustrations/find.svg' %}" alt="جستجوی ملک در VidaHome" loading="eager" decoding="async" class="w-100" style="max-height: 400px; object-fit: contain;" />
    </div>
    <div class="col-lg-6 order-lg-1">
      <span class="badge bg-faded-primary text-primary mb-3">VidaHome</span>
      <h1 class="display-5 mb-3">جستجوی ملک، مشاور املاک و خدمات مرتبط با ملک</h1>
      <p class="lead text-muted mb-4">بر اساس شهر، محله، دسته‌بندی و نوع معامله جستجو کنید؛ اگر مشاور املاک یا ارائه‌دهنده خدمات هستید، از پنل مسیر فعالیت حرفه‌ای خود را شروع کنید.</p>
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-primary" href="{% url 'listing_catalog' %}"><i class="fi-search me-2"></i>مشاهده آگهی‌ها</a>
        <a class="btn btn-outline-primary" href="{% url 'panel:agency_add' %}">ثبت مشاوره املاک</a>
        <a class="btn btn-outline-secondary" href="{% url 'panel:service_provider_add' %}">ثبت خدمات</a>
      </div>
    </div>
  </div>

  <form class="card shadow-sm border-0 mt-5 p-3 p-lg-4" method="get" action="{% url 'listing_catalog' %}">
    <div class="row g-3 align-items-end">
      <div class="col-lg-3 col-md-6">
        <label class="form-label">جستجو</label>
        <input class="form-control" type="search" name="q" placeholder="مثلاً ویلا، آپارتمان، الهیه">
      </div>
      <div class="col-lg-2 col-md-6">
        <label class="form-label">نوع معامله</label>
        <select class="form-select" name="deal">
          <option value="">همه</option>
          <option value="buy">فروش</option>
          <option value="rent">اجاره</option>
          <option value="mortgage_rent">رهن و اجاره</option>
          <option value="daily_rent">اجاره روزانه</option>
        </select>
      </div>
      <div class="col-lg-2 col-md-6">
        <label class="form-label">شهر</label>
        <select class="form-select" name="city">
          <option value="">همه شهرها</option>
          {% for city in top_cities %}
          <option value="{{ city.slug }}">{{ city.fa_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-lg-3 col-md-6">
        <label class="form-label">دسته‌بندی</label>
        <select class="form-select" name="category">
          <option value="">همه دسته‌ها</option>
          {% for category in top_categories %}
          <option value="{{ category.slug }}">{{ category.fa_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-lg-2">
        <button class="btn btn-primary w-100" type="submit"><i class="fi-search me-2"></i>جستجو</button>
      </div>
    </div>
  </form>
</section>
