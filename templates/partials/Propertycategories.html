<!-- Property categories -->
<section class="container mb-5 py-md-3">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h2 class="h3 mb-0">دسته‌بندی‌های ملک</h2>
    <a class="btn btn-link p-0" href="{% url 'categories:directory' %}">همه دسته‌ها <i class="fi-arrow-long-left me-2"></i></a>
  </div>
  <div class="row row-cols-lg-6 row-cols-sm-3 row-cols-2 g-3 g-xl-4">
    {% for category in top_categories|slice:":6" %}
    <div class="col">
      <a class="icon-box card card-body h-100 border-0 shadow-sm card-hover text-center" href="{{ category.get_absolute_url }}">
        <div class="icon-box-media bg-faded-primary text-primary rounded-circle mb-3 mx-auto">
          <i class="fi-real-estate-house"></i>
        </div>
        <h3 class="icon-box-title fs-base mb-1">{{ category.fa_name }}</h3>
        {% if category.listing_count %}
        <span class="fs-xs text-muted">{{ category.listing_count }} آگهی</span>
        {% endif %}
      </a>
    </div>
    {% empty %}
    <div class="col-12">
      <div class="alert alert-info mb-0">هنوز دسته‌بندی فعالی ثبت نشده است.</div>
    </div>
    {% endfor %}
  </div>
</section>
